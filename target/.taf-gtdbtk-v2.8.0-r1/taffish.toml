[package]
name = "gtdbtk"
kind = "tool"
version = "2.8.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/gtdbtk"

[command]
name = "taf-gtdbtk"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/gtdbtk:2.8.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[meta]
domain = "bio"
categories = ["metagenomics", "taxonomy", "mag", "sag", "microbial-genomics", "phylogenomics"]
keywords = ["GTDB-Tk", "gtdbtk", "GTDB", "taxonomy", "MAG", "SAG", "bacterial-genomics", "archaeal-genomics", "skani", "pplacer", "prodigal", "hmmer"]
description = "GTDB-Tk 2.8.0 runtime for assigning bacterial and archaeal genomes to the Genome Taxonomy Database. The large GTDB-Tk R232 reference package is external and user-provided through GTDBTK_DATA_PATH."

[upstream]
name = "GTDB-Tk"
type = "github"
repo = "Ecogenomics/GTDBTk"
homepage = "https://ecogenomics.github.io/GTDBTk/"
release_url = "https://github.com/Ecogenomics/GTDBTk/releases/tag/2.8.0"
downloads = "docker://ecogenomic/gtdbtk@sha256:6a5494765450f42e7a636d58dd84a0def26d56a89b049df8ef24956035e56052; https://github.com/Ecogenomics/GTDBTk/archive/refs/tags/2.8.0.tar.gz"
version = "2.8.0"
license = "GPL-3.0-or-later"
citation = "Chaumeil et al. 2022; Chaumeil et al. 2019"
doi = "10.1093/bioinformatics/btac672; 10.1093/bioinformatics/btz848"
pmid = "36287221; 31730192"
watch = "tags"

[smoke]
backend = "docker"
timeout = 300
exist = ["gtdbtk-smoke", "hmmbuild", "gtdbtk", "gtdbtk-download-r232-db", "gtdb_to_ncbi_majority_vote", "gtdb_to_ncbi_majority_vote.py", "prodigal", "hmmsearch", "hmmalign", "hmmpress", "hmmstat", "hmmscan", "phmmer", "pplacer", "guppy", "FastTree", "FastTreeMP", "skani", "python3", "bash", "sh", "curl", "wget", "md5sum", "gzip", "tar", "find", "ln", "awk", "sed", "grep"]
test = ["gtdbtk-smoke identity", "gtdbtk-smoke help", "gtdbtk-smoke dependencies", "gtdbtk-smoke tiny", "gtdbtk-smoke missing"]
