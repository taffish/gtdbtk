[package]
name = "gtdbtk"
kind = "tool"
version = "2.7.2"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/gtdbtk"

[command]
name = "taf-gtdbtk"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/gtdbtk:2.7.2-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[meta]
domain = "bio"
categories = ["metagenomics", "taxonomy", "mag", "sag", "microbial-genomics", "phylogenomics"]
keywords = ["GTDB-Tk", "gtdbtk", "GTDB", "taxonomy", "MAG", "SAG", "bacterial-genomics", "archaeal-genomics", "skani", "pplacer", "prodigal", "hmmer"]
description = "GTDB-Tk 2.7.2 runtime for assigning bacterial and archaeal genomes to the Genome Taxonomy Database. The large GTDB-Tk R232 reference package is external and user-provided through GTDBTK_DATA_PATH."

[upstream]
name = "GTDB-Tk"
type = "github"
repo = "Ecogenomics/GTDBTk"
homepage = "https://ecogenomics.github.io/GTDBTk/"
release_url = "https://github.com/Ecogenomics/GTDBTk/tree/2.7.2"
downloads = "docker://ecogenomic/gtdbtk:2.7.2@sha256:78ebc71b8de215fab505ed2b960f08df4923980d9acfcd0088996df483652cb0; https://github.com/Ecogenomics/GTDBTk/archive/refs/tags/2.7.2.tar.gz"
version = "2.7.2"
license = "GPL-3.0-or-later"
citation = "Chaumeil et al. 2022; Chaumeil et al. 2019"
doi = "10.1093/bioinformatics/btac672; 10.1093/bioinformatics/btz848"
pmid = "36287221; 31730192"
watch = "tags"

[smoke]
backend = "docker"
timeout = 300
exist = ["gtdbtk", "gtdbtk-download-r232-db", "gtdb_to_ncbi_majority_vote", "gtdb_to_ncbi_majority_vote.py", "prodigal", "hmmsearch", "hmmalign", "hmmpress", "hmmstat", "hmmscan", "phmmer", "pplacer", "guppy", "FastTree", "FastTreeMP", "skani", "python3", "bash", "sh", "curl", "wget", "md5sum", "gzip", "tar", "find", "ln", "awk", "sed", "grep"]
test = ["gtdbtk --version 2>&1 | grep -Fx 'gtdbtk: version 2.7.2 Copyright 2017 Pierre-Alain Chaumeil, Aaron Mussig and Donovan Parks' >/dev/null && gtdbtk --help 2>&1 | grep -F 'GTDB-Tk v2.7.2' >/dev/null && python3 -c 'import gtdbtk, dendropy, numpy, tqdm, pydantic; print(gtdbtk.__version__)' | grep -Fx '2.7.2' >/dev/null", "gtdbtk classify_wf --help 2>&1 | grep -F 'usage: gtdbtk classify_wf' >/dev/null && gtdbtk de_novo_wf --help 2>&1 | grep -F 'usage: gtdbtk de_novo_wf' >/dev/null && gtdbtk identify --help 2>&1 | grep -F 'usage: gtdbtk identify' >/dev/null && gtdbtk align --help 2>&1 | grep -F 'usage: gtdbtk align' >/dev/null && gtdbtk check_install --help 2>&1 | grep -F 'GTDB-Tk version package to test for compatibility' >/dev/null && gtdbtk test --help 2>&1 | grep -F 'usage: gtdbtk test' >/dev/null", "prodigal -v 2>&1 | grep -F 'Prodigal V2.6.3' >/dev/null && hmmsearch -h 2>&1 | grep -F '# HMMER 3.3.2' >/dev/null && hmmalign -h 2>&1 | grep -F '# HMMER 3.3.2' >/dev/null && pplacer --version 2>&1 | grep -Fx 'v1.1.alpha19-0-g807f6f3' >/dev/null && guppy --version 2>&1 | grep -Fx 'v1.1.alpha19-0-g807f6f3' >/dev/null && FastTree 2>&1 | grep -F 'FastTree Version 2.1.11' >/dev/null && FastTreeMP 2>&1 | grep -F 'FastTree Version 2.1.11' >/dev/null && skani -V 2>&1 | grep -Fx 'skani 0.3.1' >/dev/null", "gtdb_to_ncbi_majority_vote --help 2>&1 | grep -F 'GTDB to NCBI Majority Vote v0.2.1' >/dev/null && gtdb_to_ncbi_majority_vote.py --help 2>&1 | grep -F 'Translate GTDB to NCBI classification via majority vote' >/dev/null", "tmp=/tmp/taf-gtdbtk-helper-$$; rm -rf \"$tmp\" && mkdir -p \"$tmp\" && gtdbtk-download-r232-db --help 2>&1 | grep -F 'Download and install the GTDB-Tk R232 reference package' >/dev/null && (cd \"$tmp\" && gtdbtk-download-r232-db --dry-run 2>&1 | grep -F 'Download directory:' | grep -F \"$tmp/downloads\" >/dev/null) && mkdir -p \"$tmp/existing/r232\" && gtdbtk-download-r232-db --db-root \"$tmp/existing\" 2>&1 | grep -F \"Existing DBROOT/r232 directory found: $tmp/existing/r232\" >/dev/null && gtdbtk-download-r232-db --dry-run --db-root /tmp/taf-gtdbtk-r232-db-explicit 2>&1 | grep -F 'Expected MD5: 25a59e0352b1fd150c589f56559767d4' >/dev/null; status=$?; rm -rf \"$tmp\"; exit \"$status\"", "tmp=/tmp/taf-gtdbtk-no-db-$$; rm -rf \"$tmp\" && mkdir -p \"$tmp/genomes\" && printf '>tiny\\nATGAAATAA\\n' > \"$tmp/genomes/tiny.fna\" && if gtdbtk classify_wf --genome_dir \"$tmp/genomes\" --out_dir \"$tmp/out\" --cpus 1 >\"$tmp/run.log\" 2>&1; then cat \"$tmp/run.log\" >&2; exit 1; else grep -F 'The GTDB-Tk reference data does not exist or is corrupted.' \"$tmp/run.log\" >/dev/null && grep -F 'GTDBTK_DATA_PATH=/refdata/' \"$tmp/run.log\" >/dev/null && test ! -e \"$tmp/out/gtdbtk.bac120.summary.tsv\"; fi; status=$?; rm -rf \"$tmp\"; exit \"$status\""]
